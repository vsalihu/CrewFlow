name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Match the major version of the managed Supabase project (see docs/dependencies.md).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CDS_APP_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations apply to an empty database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database cds_ci"
          DATABASE_MIGRATION_URL=postgresql://postgres:postgres@localhost:5432/cds_ci pnpm db:migrate
      - name: Domain, database and permission tests (real PostgreSQL)
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://cds_app:unused@localhost:5432/cds_ci
      - name: End-to-end coordinator journeys (Playwright)
        run: |
          pnpm --filter @cds/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
